aquifer_url: http://aquifer.internal:8080

confirmation:
  delay_ms: 4000
  jitter_ratio: 0.2
  base_backoff_ms: 1000
  max_backoff_ms: 60000

routes:
  - id: github-main
    path: /webhooks/github/main
    provider: github
    secret_ref: GITHUB_WEBHOOK_SECRET
    destination: https://backend.example.com/webhooks/github
    max_retries: -1

  - id: shopify-main
    path: /webhooks/shopify/main
    provider: shopify
    secret_ref: SHOPIFY_WEBHOOK_SECRET
    destination: https://backend.example.com/webhooks/shopify

  - id: stripe-connect
    path: /webhooks/stripe/connect
    provider: stripe
    secret_ref: STRIPE_WEBHOOK_SECRET
    destination: https://backend.example.com/webhooks/stripe
    fairness_key: body:/account

  - id: anthropic-main
    path: /webhooks/anthropic/main
    provider: anthropic
    secret_ref: ANTHROPIC_WEBHOOK_SECRET
    destination: https://backend.example.com/webhooks/anthropic

  - id: openai-main
    path: /webhooks/openai/main
    provider: openai
    secret_ref: OPENAI_WEBHOOK_SECRET
    destination: https://backend.example.com/webhooks/openai

  - id: slack-main
    path: /webhooks/slack/main
    provider: slack
    secret_ref: SLACK_SIGNING_SECRET
    destination: https://backend.example.com/webhooks/slack

  - id: twilio-status
    path: /webhooks/twilio/status
    provider: twilio
    secret_ref: TWILIO_AUTH_TOKEN
    public_url: https://inlet.example.com/webhooks/twilio/status
    destination: https://backend.example.com/webhooks/twilio/status

  - id: telegram-main
    path: /webhooks/telegram/main
    provider: telegram
    secret_ref: TELEGRAM_WEBHOOK_SECRET
    destination: https://backend.example.com/webhooks/telegram

  - id: whatsapp-main
    path: /webhooks/whatsapp/main
    provider: whatsapp
    secret_ref: WHATSAPP_APP_SECRET
    verification_secret_ref: WHATSAPP_VERIFY_TOKEN
    destination: https://backend.example.com/webhooks/whatsapp
